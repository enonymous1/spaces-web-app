<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_path }} - &lt;MY&gt;SPACE File Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="bg-gray-100">
    <!-- Window Chrome -->
    <div class="bg-white rounded-lg shadow-2xl border border-gray-300 max-w-4xl mx-auto mt-8">
        <!-- Title Bar -->
        <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex items-center justify-between rounded-t-lg">
            <div class="flex items-center space-x-3">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                </div>
                <span class="font-medium text-gray-700">{{ folder_path }}</span>
            </div>
            <div class="flex items-center space-x-2">
                <button class="p-1 hover:bg-gray-200 rounded" onclick="window.history.back()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <button class="p-1 hover:bg-gray-200 rounded" onclick="window.location.href='/'">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex items-center space-x-4">
            <span class="text-sm text-gray-500">Demo contents — not a real file system.</span>
        </div>

        <!-- File Content Area -->
        <div class="content p-4 min-h-96">
            <div class="grid grid-cols-6 gap-4">
                {% for item in contents %}
                <div class="file-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-100 cursor-pointer" 
                     ondblclick="openItem('{{ item.type }}', '{{ item.name }}')">
                    <div class="w-12 h-12 mb-2 flex items-center justify-center">
                        {% if item.icon == 'folder' %}
                            <svg class="w-10 h-10 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
                            </svg>
                        {% elif item.icon == 'document' %}
                            <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        {% elif item.icon == 'photograph' %}
                            <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        {% endif %}
                    </div>
                    <span class="text-sm text-center max-w-full truncate">{{ item.name }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        function openItem(type, name) {
            if (type === 'folder') {
                window.location.href = `/folder/{{ folder_path }}/${name}`;
            } else {
                alert(`Opening ${name}`);
            }
        }
    </script>
</body>
</html>
