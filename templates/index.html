<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt;MY&gt;SPACE - Desktop Environment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="h-screen overflow-hidden bg-black relative">
    <!-- Desktop Background -->
    <div id="desktop" class="relative w-full h-full" oncontextmenu="showContextMenu(event)">
        
        <!-- Desktop Icons -->
        <div id="desktop-items">
            {% for item in items %}
            <div class="desktop-item absolute cursor-pointer select-none"
                 style="left: {{ item.x }}px; top: {{ item.y }}px;"
                 data-id="{{ item.id }}"
                 onclick="handleItemClick('{{ item.type }}', {{ item.name | tojson }}, {{ item.id }})"
                 ondblclick="handleItemDoubleClick('{{ item.type }}', {{ item.name | tojson }}, {{ item.id }})"
                 draggable="true"
                 ondragstart="handleDragStart(event)"
                 ondragend="handleDragEnd(event)">
                
                <div class="flex flex-col items-center p-2 rounded-lg hover:bg-white/10 transition-colors duration-200">
                    <!-- Icon -->
                    <div class="w-12 h-12 mb-1 flex items-center justify-center">
                        {% if item.icon == 'folder' %}
                            <svg class="w-10 h-10 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
                            </svg>
                        {% elif item.icon == 'terminal' %}
                            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        {% elif item.icon == 'document-text' %}
                            <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        {% endif %}
                    </div>
                    
                    <!-- Label -->
                    <span class="text-white text-xs text-center max-w-16 truncate">{{ item.name }}</span>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Context Menu -->
        <div id="context-menu" class="fixed hidden bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
            <div class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-sm" onclick="createNewFolder()">New Folder</div>
            <div class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-sm" onclick="refreshDesktop()">Refresh</div>
            <div class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-sm" onclick="sortDesktopIcons()">Sort by Name</div>
            <div class="border-t border-gray-200 my-1"></div>
            <div class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-sm" onclick="openSettings()">Settings</div>
        </div>

        <!-- Windows Container -->
        <div id="windows-container"></div>
    </div>

    <!-- Folder Modal -->
    <div id="folder-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeFolderModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4/5 max-w-4xl h-3/4 bg-gray-900/90 backdrop-blur-lg rounded-lg border border-purple-500/30 shadow-2xl">
            <!-- Modal Header -->
            <div class="window-header flex items-center justify-between p-4 border-b border-purple-500/30">
                <div class="flex items-center space-x-3">
                    <svg class="w-6 h-6 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
                    </svg>
                    <h2 id="folder-title" class="text-white font-medium text-lg">Folder</h2>
                </div>
                <button onclick="closeFolderModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Modal Content -->
            <div class="p-6 h-full overflow-auto">
                <div id="folder-contents" class="grid grid-cols-6 gap-4">
                    <!-- Folder contents will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar fixed bottom-0 left-0 right-0 h-12 bg-black/60 backdrop-blur-lg border-t border-purple-500/30 flex items-center justify-between px-4">
        <!-- Start Button -->
        <button class="px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white rounded-md text-sm font-medium transition-all duration-200 shadow-lg border border-purple-400/30" onclick="toggleStartMenu()">
            &lt;MY&gt;SPACE
        </button>

        <!-- Running Apps -->
        <div id="running-apps" class="flex space-x-2">
            <!-- Apps will be added here dynamically -->
        </div>

        <!-- System Tray -->
        <div class="flex items-center space-x-4 text-white text-sm">
            <div id="clock" class="cursor-pointer" onclick="showCalendar()">
                <div id="time">12:00 PM</div>
                <div id="date" class="text-xs text-gray-300">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="fixed bottom-12 left-4 hidden bg-gray-800 rounded-lg shadow-2xl border border-gray-600 w-80 h-96 overflow-hidden">
        <div class="p-4 border-b border-gray-600">
            <h3 class="text-white font-medium">Applications</h3>
        </div>
        <div class="p-4 grid grid-cols-3 gap-4">
            <div class="flex flex-col items-center p-3 rounded-lg hover:bg-gray-700 cursor-pointer" onclick="openApp('calculator')">
                <svg class="w-8 h-8 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                <span class="text-white text-xs">Calculator</span>
            </div>
            <div class="flex flex-col items-center p-3 rounded-lg hover:bg-gray-700 cursor-pointer" onclick="openApp('notepad')">
                <svg class="w-8 h-8 text-green-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                <span class="text-white text-xs">Notepad</span>
            </div>
            <div class="flex flex-col items-center p-3 rounded-lg hover:bg-gray-700 cursor-pointer" onclick="openApp('browser')">
                <svg class="w-8 h-8 text-orange-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9v-9m0-9v9m0 9c-5 0-9-4-9-9s4-9 9-9"></path>
                </svg>
                <span class="text-white text-xs">Browser</span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/desktop.js') }}"></script>
</body>
</html>
